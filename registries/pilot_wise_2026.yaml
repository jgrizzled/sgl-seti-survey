  sirius-a:
    display_name: "Sirius A"
    endpoint_kind: component
    priority: 0.9
    tags: [pilot, binary-component, bright-artifacts]
    notes: >-
      Primary-component endpoint. The hip2 (van Leeuwen 2007) HIP 32349
      astrometry is adopted AS the system barycenter: validated on
      2026-08-18 by predicting the 2MASS epoch-2000 position of Sirius A
      to 0.16 arcsec under this interpretation (vs 1.4 arcsec if treated
      as an instantaneous photocenter state, and 3.6 arcsec for an
      explicitly re-corrected barycenter) — see
      surveys/wise/notes/registry_curation.md. PM uncertainties are
      inflated to 20 mas/yr as the systematic allocation implied by that
      0.16 arcsec / 8.75 yr validation bound.
    identifiers:
      - catalog: "HIP"
        id: "32349"
        version: "Hipparcos, the New Reduction (van Leeuwen 2007), via VizieR I/311/hip2 (retrieved 2026-08-18)"
      - catalog: "Bond et al."
        id: "Sirius AB orbit"
        version: "2017, ApJ 840, 70, Table 4 (confirmed against ar5iv full text 2026-08-18)"
    quality: "published HST orbit; hip2 barycenter interpretation validated against 2MASS"
    model_rationale: >-
      Bright resolved binary with no Gaia solution; two-body orbit about
      a linearly moving barycenter is the appropriate model.
    state:
      provider: two_body_orbit_v1
      astrometry:
        frame: icrs
        ra_deg: 101.28854105
        dec_deg: -16.71314306
        parallax_mas: 378.90
        pm_ra_cosdec_mas_per_yr: -546.01
        pm_dec_mas_per_yr: -1223.07
        radial_velocity_km_s: -8.47
        reference_epoch_jyear: 1991.25
        reference_epoch_scale: tt
        source: >-
          Barycenter: van Leeuwen 2007 HIP 32349 via VizieR I/311/hip2
          (orbit-corrected solution, validated against 2MASS); parallax
          378.90 mas adopted by Bond et al. 2017 (hip2's 379.21+/-1.58
          agrees at 0.2 sigma); RV is the gravitational-redshift-corrected
          systemic velocity from Bond et al. 2017
      provenance:
        ra_deg:
          source: "van Leeuwen 2007 via VizieR I/311/hip2"
          uncertainty: 1.21
          unit: mas
        dec_deg:
          source: "van Leeuwen 2007 via VizieR I/311/hip2"
          uncertainty: 1.04
          unit: mas
        parallax_mas:
          source: "Bond et al. 2017 adopted (Gatewood & Gatewood 1978 + Hipparcos weighted mean)"
          uncertainty: 1.27
          unit: mas
        pm_ra_cosdec_mas_per_yr:
          source: "van Leeuwen 2007 (1.33) + 2MASS-validation systematic allocation, quadrature"
          uncertainty: 20.0
          unit: mas/yr
        pm_dec_mas_per_yr:
          source: "van Leeuwen 2007 (1.24) + 2MASS-validation systematic allocation, quadrature"
          uncertainty: 20.0
          unit: mas/yr
        radial_velocity_km_s:
          source: "Bond et al. 2017 systemic, redshift-corrected (conservative allocation)"
          uncertainty: 0.5
          unit: km/s
        period_yr:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.0043
          unit: yr
        periastron_epoch_jyear:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.0058
          unit: yr
        eccentricity:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.00037
          unit: "1"
        semimajor_axis_arcsec:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.0025
          unit: arcsec
        inclination_deg:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.040
          unit: deg
        ascending_node_deg:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.071
          unit: deg
        arg_periastron_deg:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.075
          unit: deg
      orbit:
        period_yr: 50.1284

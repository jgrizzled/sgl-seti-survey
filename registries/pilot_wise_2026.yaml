  # ---- v1.1 expansion endpoints (2026-08-18) ------------------------

  proxima-cen:
    display_name: "Proxima Centauri (GJ 551)"
    endpoint_kind: star
    priority: 1.0
    tags: [pilot-expansion, isolated-solution, alpha-cen-system]
    notes: >-
      Nearest star. Physically bound to Alpha Cen AB but with a ~550 kyr
      orbit, so orbital acceleration is negligible over the WISE
      baseline and the Gaia DR3 single-star solution (RUWE 0.97) is the

# Pilot target registry for the WISE/NEOWISE shakedown (plan §4.2).
#
# STATUS: v1.4 (2026-08-19) — batch-4 + unblocked-deferred endpoints
# (47 targets, 38 corridors): 61-cyg-a/b, struve-2398-a/b,
# groombridge-34-a/b, gj-1111, luyten-star, kapteyn-star, lp-145-141,
# gj-1221, gj-9193, gj-783, eps-ind-b, gj-11068, wise-0855, ez-aqr,
# luhman16-a/b (Garcia 2017 orbit), procyon-a/b (Bond 2015 orbit,
# hip2-as-barycenter validated vs 2MASS 0.31"). No deferred systems
# remain.
# v1.3 (2026-08-19) — batch-3 endpoints added (WISE overlay
# mid-confusion queue): eps-eri, lacaille-9352, gj-1061, gj-12724,
# wolf-1061 (26 targets, 23 corridors).
# v1.2 (2026-08-19) — batch-2 endpoints added from the
# universal target list (targets/universal_v1) per the WISE overlay
# work queue: ross-128, eps-ind-a, tau-cet, gj-54, teegarden,
# lacaille-8760, van-maanen, gj-908, gj-784 (21 targets, 18 corridors).
# eps Ind Ba/Bb DEFERRED (RUWE 4.3 photocenter; needs Ba/Bb orbit).
# v1.1 (2026-08-18): expansion after the pilot passed (plan §4.2):
# proxima-cen, wolf-359, ross-248, gj65-a, gj65-b. v1.0 curation
# record: see surveys/wise/notes/registry_curation.md for the evidence
# behind each decision:
#   - Alpha Cen: coherent Kervella et al. 2016 (A&A 594, A107) barycenter
#     solution (position, PM, parallax 747.17 mas, RV, orbit, mass
#     fraction) replaces the earlier mixed demonstration values.
#   - Sirius: the van Leeuwen 2007 (hip2) solution is adopted AS the
#     barycenter — validated against the 2MASS epoch-2000 position of
#     Sirius A (0.16" agreement, vs 1.4"/3.6" for the alternatives);
#     PM uncertainties inflated to 20 mas/yr as the systematic allocation
#     implied by that validation bound. Parallax and systemic RV from
#     Bond et al. 2017.
#   - Covariance: DIAGONAL BY DECLARED ASSUMPTION (per-value 1-sigma
#     uncertainties only; ESA Gaia archive unreachable from the dev
#     network and VizieR I/355 omits correlation columns). Propagated
#     99% locus radii are <= 0.1" against a 10" search padding, so
#     correlation terms cannot change any search decision at pilot scale.
#
# Endpoint decisions (2026-08-18): full five-system shortlist; component
# endpoints (not barycenters) for the multiples -> 7 endpoint hypotheses.

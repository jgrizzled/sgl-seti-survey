          unit: km/s
        period_yr:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.0043
          unit: yr
        periastron_epoch_jyear:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.0058
          unit: yr
        eccentricity:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.00037
          unit: "1"
        semimajor_axis_arcsec:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.0025
          unit: arcsec
        inclination_deg:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.040
          unit: deg
        ascending_node_deg:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.071
          unit: deg
        arg_periastron_deg:
          source: "Bond et al. 2017 Table 4"
          uncertainty: 0.075
          unit: deg

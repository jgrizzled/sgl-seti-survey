  gj65-a:
    display_name: "Luyten 726-8 A (BL Ceti, GJ 65 A)"
    endpoint_kind: component
    priority: 0.9
    tags: [pilot-expansion, binary-component]
    notes: >-
      Primary-component endpoint via the GRAVITY 2024 orbit. Barycenter
      astrometry is CONSTRUCTED as the dynamical-mass-weighted
      combination of the two Gaia DR3 component solutions at their
      common 2016.0 epoch (orbital terms cancel in the mass-weighted
      sum); the component solutions have RUWE ~11, so uncertainties are
      inflated. Validated by predicting the 2MASS epoch-1998.58 blended
      position (pair near periastron, sep ~0.8 arcsec, photocenter ~
      barycenter for these near-equal components) to 0.34 arcsec over
      17.4 yr. Orbit sign convention validated against the Gaia DR3
      A-B relative position at 2016.0 (see registry_curation notes).
    identifiers:
      - catalog: "Gaia DR3"
        id: "5140693571158739840"
        version: "Gaia DR3, via VizieR I/355/gaiadr3 (retrieved 2026-08-18)"
      - catalog: "GRAVITY Collaboration"
        id: "GJ65 AB orbit"
        version: "2024, arXiv:2404.08746, Table 1"
    quality: "GRAVITY interferometric orbit; constructed barycenter validated vs 2MASS"
    model_rationale: >-
      26.4-yr binary: Gaia component solutions are orbit-corrupted
      (RUWE ~11); two-body orbit about a constructed linearly moving
      barycenter is the appropriate model.
    state:
      provider: two_body_orbit_v1
      astrometry:
        frame: icrs
        ra_deg: 24.77161274
        dec_deg: -17.94799915
        parallax_mas: 371.92
        pm_ra_cosdec_mas_per_yr: 3284.6
        pm_dec_mas_per_yr: 563.7
        radial_velocity_km_s: 15.99
        reference_epoch_jyear: 2016.0
        reference_epoch_scale: tcb
        source: >-
          Constructed: dynamical-mass-weighted (fA=0.5126, fB=0.4874)
          combination of Gaia DR3 5140693571158739840 +
          5140693571158946048 at epoch 2016.0; parallax from Kervella
          et al. 2022 as adopted by GRAVITY 2024; RV = mass-weighted
          Gaia DR3 component RVs

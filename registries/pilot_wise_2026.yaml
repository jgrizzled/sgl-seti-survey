# Pilot target registry for the WISE/NEOWISE shakedown (plan §4.2).
#
# STATUS: v1.1 (2026-08-18) — curated; expansion endpoints added after
# the pilot passed (plan §4.2): proxima-cen, wolf-359, ross-248,
# gj65-a, gj65-b (12 targets total, 9 corridors). v1.0 curation record:
# see surveys/wise/notes/registry_curation.md for the evidence behind
# each decision:
#   - Alpha Cen: coherent Kervella et al. 2016 (A&A 594, A107) barycenter
#     solution (position, PM, parallax 747.17 mas, RV, orbit, mass
#     fraction) replaces the earlier mixed demonstration values.
#   - Sirius: the van Leeuwen 2007 (hip2) solution is adopted AS the
#     barycenter — validated against the 2MASS epoch-2000 position of
#     Sirius A (0.16" agreement, vs 1.4"/3.6" for the alternatives);
#     PM uncertainties inflated to 20 mas/yr as the systematic allocation
#     implied by that validation bound. Parallax and systemic RV from
#     Bond et al. 2017.
#   - Covariance: DIAGONAL BY DECLARED ASSUMPTION (per-value 1-sigma
#     uncertainties only; ESA Gaia archive unreachable from the dev
#     network and VizieR I/355 omits correlation columns). Propagated
#     99% locus radii are <= 0.1" against a 10" search padding, so
#     correlation terms cannot change any search decision at pilot scale.
#
# Endpoint decisions (2026-08-18): full five-system shortlist; component
# endpoints (not barycenters) for the multiples -> 7 endpoint hypotheses.

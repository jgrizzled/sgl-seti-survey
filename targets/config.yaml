# Universal target-list configuration (survey-agnostic).
# Method: notes/sgl_seti_star_ranking_methods.md, simplified per the
# staged design (distance core protected; basket union; labels).
# v2 (2026-08-20): horizon 8 -> 10 pc and picky-network baskets per
# notes/picky_network_hypothesis_sgl_seti.md (desirability levels,
# engineering backbone, curated science interest).
version: v2
census:
  source: "CNS5 (Golovin et al. 2023) via VizieR J/A+A/670/A19/cns5, retrieved 2026-08-20"
  snapshot: "census/cns5_10pc_2026-08-20.csv"
  engineering: "census/engineering_2026-08-20.csv"   # scripts/pull_census.py joins
  horizon_pc: 10.0
  system_grouping_pc: 0.1        # projected separation for system consolidation
  system_plx_tol: 0.10           # fractional parallax agreement required

stage1:
  historical_window_myr: 1.0     # +/- window for linear closest approach
  knn_ks: [1, 2, 3]              # mutual-kNN graph family members

stage2:
  close_multiple_au: 100.0       # min pair separation below which "close"
  wide_multiple_au: 1000.0
  # Systems with a curated/published orbit usable for track prediction
  # (registry v1.1 + well-known published solutions).
  orbit_available:
    - "alpha Cen"        # Kervella et al. 2016 (registry v1.1)
    - "Sirius"           # Bond et al. 2017 (registry v1.1)
    - "GJ 65"            # GRAVITY 2024 (registry v1.1)
    - "Procyon"          # Bond et al. 2015 published orbit
    - "70 Oph"           # long-published visual orbit
    - "Luhman 16"        # Bedin/GRAVITY orbit solutions

# Engineering / desirability layer (picky-network note §3, §10).
stage2b:
  activity:
    logRpHK_active: -4.75         # Boro Saikia+2018; > this = active FGK
    pEWHa_active_A: -0.5          # CARMENES Halpha pEW (Angstrom); emission < this = active
    rosat_ecf_erg_cm2_ct: 6.0e-12 # PSPC energy conversion factor (erg/cm2 per count)
    rosat_limit_ct_s: 0.05        # RASS ~all-sky detection limit used for upper limits
    log_lx_lbol_active: -4.0      # saturated/active above; quiet-Sun is ~ -6.5
  accel:
    pma_snr: 5.0                  # Kervella+2022 flags > 3; 3-5 are planet-level anomalies, recorded not disqualifying
    hgca_chi2: 11.8               # Brandt 2021: 3-sigma for 2 d.o.f.; used only when PMa unavailable
    ruwe: 1.4
    ruwe_bright_g: 6.0            # RUWE unreliable for saturated bright stars; PMa decides
  flame_evol_subgiant: 360        # Gaia FLAME evolstage >= 360 = post-MS
  massive_short_lived_msun: 1.5   # A/F stars: short MS lifetime
  known_evolved: ["Procyon"]      # saturated in Gaia; F5 IV-V subgiant
  known_rapid_rotators: ["Altair", "Vega", "Fomalhaut"]  # A stars, vsini >> 100 km/s
  desirability:
    revote_levels: [1, 2]         # level 1: drop close/substellar/evolved;
                                  # level 2: also intermediate/accel/active/rapid

stage4:
  n_distance_core: 25            # basket A: nearest systems, no exclusions
  adjacency_vote_min: 3          # basket B/C: >= votes of 7 graph families
  n_historical: 8                # top closest-approach additions
  n_engineering: 12              # engineering-backbone basket size
  engineering_require_measured_quiet: true   # unknown activity != favorable
  engineering_weights:           # rank-sum weights (sum ~ 1)
    compactness: 0.20            # M/R^2: focal line starts closer
    power: 0.15                  # log L: stellar power at the relay (note §5)
    activity: 0.20               # within the measured-quiet pool: Lx/Lbol, R'HK rank
    acceleration: 0.15
    lifetime: 0.05
    distance: 0.25               # attachment convenience A_sun,i (note §1, §8)
  track_budget: 95               # max component tracks after union

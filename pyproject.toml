[project]
name = "sgl-seti-survey"
version = "0.1.0"
requires-python = ">=3.12.2"
dependencies = [
    "sglseti",
    "astropy>=6.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
sglseti = { path = "../sglseti", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sglsurvey"]
